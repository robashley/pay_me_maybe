<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maybepayme Invoice Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    header {
      background: white;
      padding: 20px 24px;
      border-radius: 8px;
      margin-bottom: 24px;
      border: 1px solid #e0e0e0;
    }
    
    header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    header p {
      font-size: 14px;
      color: #666;
    }
    
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 0;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .tab-button {
      padding: 12px 16px;
      background: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    
    .tab-button.active {
      color: #333;
      border-bottom-color: #333;
    }
    
    .tab-button:hover {
      color: #333;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    /* Add Invoice Form */
    .form-section {
      background: white;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #333;
    }
    
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #333;
      background: #fafafa;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    
    .form-row-three {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }
    
    button {
      padding: 10px 16px;
      border: 1px solid #333;
      border-radius: 6px;
      background: white;
      color: #333;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #f5f5f5;
    }
    
    button.primary {
      background: #333;
      color: white;
      border-color: #333;
    }
    
    button.primary:hover {
      background: #1a1a1a;
    }
    
    /* Invoice List */
    .invoice-list {
      display: grid;
      gap: 12px;
    }
    
    .invoice-card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      transition: all 0.2s;
    }
    
    .invoice-card:hover {
      border-color: #d0d0d0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .invoice-card.overdue {
      border-left: 4px solid #d32f2f;
    }
    
    .invoice-card.pending {
      border-left: 4px solid #ffa500;
    }
    
    .invoice-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }
    
    .invoice-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
    }
    
    .invoice-amount {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }
    
    .invoice-details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      font-size: 12px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .detail-item {
      display: flex;
      flex-direction: column;
    }
    
    .detail-label {
      color: #999;
      margin-bottom: 3px;
      font-weight: 500;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    
    .detail-value {
      color: #333;
      font-weight: 500;
      font-size: 13px;
    }
    
    .countdown {
      font-weight: 600;
      color: #d32f2f;
    }
    
    .countdown.pending {
      color: #ffa500;
    }
    
    .escalation-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }
    
    .escalation-badge.stage-0 {
      background: #e3f2fd;
      color: #1565c0;
    }
    
    .escalation-badge.stage-1 {
      background: #fff3e0;
      color: #e65100;
    }
    
    .escalation-badge.stage-2 {
      background: #ffe0b2;
      color: #e65100;
    }
    
    .escalation-badge.stage-3 {
      background: #ffcdd2;
      color: #c62828;
    }
    
    .invoice-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    
    .invoice-actions button {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
    }
    
    /* Template Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal {
      background: white;
      border-radius: 8px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }
    
    .modal h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }
    
    .modal-content {
      display: grid;
      gap: 16px;
      margin-bottom: 20px;
    }
    
    .template-text {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid #e0e0e0;
      font-family: 'Monaco', monospace;
    }
    
    .stat-box {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    
    .stat-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    
    .stat-value {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    
    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #666;
    }
    
    .empty-state p {
      font-size: 14px;
      color: #999;
    }
    
    .close-button {
      float: right;
      font-size: 24px;
      line-height: 1;
      color: #999;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      width: auto;
    }
    
    .close-button:hover {
      color: #333;
    }
    
    .copy-button {
      background: #333;
      color: white;
      margin-top: 12px;
      display: block;
      width: 100%;
    }
    
    @media (max-width: 600px) {
      .form-row,
      .form-row-three,
      .invoice-details {
        grid-template-columns: 1fr;
      }
      
      .invoice-header {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 Invoice Tracker</h1>
      <p>Track invoices, calculate late payments, and get escalation strategies</p>
    </header>
    
    <div class="tabs">
      <button class="tab-button active" data-tab="add-invoice">Add Invoice</button>
      <button class="tab-button" data-tab="invoices">My Invoices</button>
      <button class="tab-button" data-tab="export">Export/Import</button>
    </div>
    
    <!-- Add Invoice Tab -->
    <div id="add-invoice" class="tab-content active">
      <div class="form-section">
        <h2 style="margin-bottom: 20px; font-size: 18px;">Add a new invoice</h2>
        
        <div class="form-group">
          <label>Client name</label>
          <input type="text" id="clientName" placeholder="e.g. Acme Corp">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Invoice amount (£)</label>
            <input type="number" id="amount" placeholder="1500.00" step="0.01" min="0">
          </div>
          <div class="form-group">
            <label>Due date</label>
            <input type="date" id="dueDate">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Late payment rate (% per month)</label>
            <input type="number" id="lateRate" placeholder="5" step="0.1" min="0" value="5">
          </div>
          <div class="form-group">
            <label>Invoice reference</label>
            <input type="text" id="invoiceRef" placeholder="INV-001">
          </div>
        </div>
        
        <button class="primary" onclick="addInvoice()" style="width: 100%; padding: 12px;">Add invoice</button>
      </div>
    </div>
    
    <!-- Invoices Tab -->
    <div id="invoices" class="tab-content">
      <div id="invoicesList" class="invoice-list"></div>
    </div>
    
    <!-- Export/Import Tab -->
    <div id="export" class="tab-content">
      <div class="form-section">
        <h2 style="margin-bottom: 20px; font-size: 18px;">Backup your data</h2>
        <p style="margin-bottom: 16px; color: #666; font-size: 14px;">Download your invoices as a JSON file. You can re-upload this file to restore your invoices on another device.</p>
        <button class="primary" onclick="exportInvoices()" style="width: 100%; padding: 12px; margin-bottom: 20px;">📥 Download invoices</button>
        
        <h3 style="margin: 24px 0 16px; font-size: 16px;">Restore invoices</h3>
        <div class="form-group">
          <input type="file" id="importFile" accept=".json">
        </div>
        <button onclick="importInvoices()" style="width: 100%; padding: 12px;">📤 Upload file</button>
      </div>
    </div>
  </div>
  
  <!-- Template Modal -->
  <div class="modal-overlay" id="templateModal">
    <div class="modal">
      <button class="close-button" onclick="closeModal()">&times;</button>
      <h2 id="modalTitle">Template</h2>
      <div id="modalContent" class="modal-content"></div>
      <button class="copy-button" onclick="copyToClipboard()">📋 Copy template</button>
    </div>
  </div>
  
  <script>
    const ESCALATION_STAGES = [
      {
        stage: 0,
        name: 'Reminder (due soon)',
        daysRange: [-7, 0],
        tone: 'friendly',
        template: `Hi {CLIENT},

Just a quick reminder that invoice {REF} for £{AMOUNT} is due on {DUEDATE}.

Looking forward to receiving your payment.

Best regards`
      },
      {
        stage: 1,
        name: 'Follow-up (just overdue)',
        daysRange: [1, 7],
        tone: 'polite',
        template: `Hi {CLIENT},

I noticed invoice {REF} for £{AMOUNT} is now overdue (due {DUEDATE}).

Could you prioritize payment at your earliest convenience?

Thanks,`
      },
      {
        stage: 2,
        name: 'Firm (seriously overdue)',
        daysRange: [8, 30],
        tone: 'firm',
        template: `Hi {CLIENT},

Invoice {REF} is now {DAYSOVERDUE} days overdue and requires immediate payment.

Amount due: £{AMOUNT}
Late payment interest accrued: £{LATEINTEREST}

Please remit payment immediately to avoid further charges. Late payment interest is accruing at {RATE}% per month on this balance.

{CLIENT} {REF}`
      },
      {
        stage: 3,
        name: 'Final notice (legal)',
        daysRange: [31, Infinity],
        tone: 'formal',
        template: `FORMAL NOTICE OF OVERDUE PAYMENT

Invoice Number: {REF}
Due Date: {DUEDATE}
Days Overdue: {DAYSOVERDUE}

Original Amount: £{AMOUNT}
Late Payment Interest (at {RATE}% per month): £{LATEINTEREST}
TOTAL AMOUNT NOW DUE: £{TOTALDUE}

This is a formal notice that immediate payment is required. Failure to remit payment within 5 working days may result in further action being taken.

Regards`
      }
    ];
    
    let invoices = [];
    let currentModal = null;
    
    // Load from localStorage on page load
    function loadInvoices() {
      const saved = localStorage.getItem('maybepayme_invoices');
      invoices = saved ? JSON.parse(saved) : [];
      renderInvoices();
    }
    
    // Save to localStorage
    function saveInvoices() {
      localStorage.setItem('maybepayme_invoices', JSON.stringify(invoices));
      renderInvoices();
    }
    
    // Calculate days until/overdue
    function calculateDays(dueDate) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(dueDate);
      due.setHours(0, 0, 0, 0);
      const diff = due - today;
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }
    
    // Get escalation stage
    function getEscalationStage(daysOverdue) {
      for (let stage of ESCALATION_STAGES) {
        if (daysOverdue >= stage.daysRange[0] && daysOverdue <= stage.daysRange[1]) {
          return stage;
        }
      }
      return ESCALATION_STAGES[3];
    }
    
    // Calculate late payment interest
    function calculateLateInterest(amount, daysOverdue, monthlyRate) {
      if (daysOverdue <= 0) return 0;
      const dailyRate = monthlyRate / 100 / 30;
      return amount * dailyRate * daysOverdue;
    }
    
    // Format currency
    function formatCurrency(amount) {
      return '£' + Math.round(amount * 100) / 100;
    }
    
    // Add invoice
    function addInvoice() {
      const clientName = document.getElementById('clientName').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const dueDate = document.getElementById('dueDate').value;
      const lateRate = parseFloat(document.getElementById('lateRate').value) || 5;
      const invoiceRef = document.getElementById('invoiceRef').value.trim() || 'INV-' + Date.now();
      
      if (!clientName || !amount || !dueDate) {
        alert('Please fill in all required fields');
        return;
      }
      
      const invoice = {
        id: Date.now().toString(),
        clientName,
        amount,
        dueDate,
        lateRate,
        invoiceRef,
        status: 'open'
      };
      
      invoices.push(invoice);
      saveInvoices();
      
      // Clear form
      document.getElementById('clientName').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('dueDate').value = '';
      document.getElementById('lateRate').value = '5';
      document.getElementById('invoiceRef').value = '';
      
      // Switch to invoices tab
      switchTab('invoices');
    }
    
    // Render invoices
    function renderInvoices() {
      const list = document.getElementById('invoicesList');
      
      if (invoices.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>No invoices yet</h3>
            <p>Add your first invoice to get started with tracking and escalation templates.</p>
          </div>
        `;
        return;
      }
      
      list.innerHTML = invoices.map(inv => {
        const daysLeft = calculateDays(inv.dueDate);
        const daysOverdue = daysLeft < 0 ? -daysLeft : 0;
        const stage = getEscalationStage(daysLeft);
        const lateInterest = calculateLateInterest(inv.amount, daysOverdue, inv.lateRate);
        const totalDue = inv.amount + lateInterest;
        
        const isOverdue = daysLeft < 0;
        const statusClass = isOverdue ? 'overdue' : 'pending';
        
        let countdownText = '';
        if (daysLeft > 0) {
          countdownText = `Due in ${daysLeft} day${daysLeft !== 1 ? 's' : ''}`;
        } else if (daysLeft === 0) {
          countdownText = 'Due today';
        } else {
          countdownText = `${daysOverdue} day${daysOverdue !== 1 ? 's' : ''} overdue`;
        }
        
        return `
          <div class="invoice-card ${statusClass}">
            <div class="invoice-header">
              <div>
                <div class="invoice-title">${inv.clientName}</div>
                <div class="invoice-amount">${formatCurrency(inv.amount)}</div>
              </div>
              <div class="countdown ${statusClass}">${countdownText}</div>
            </div>
            
            <div class="invoice-details">
              <div class="detail-item">
                <div class="detail-label">Reference</div>
                <div class="detail-value">${inv.invoiceRef}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Due date</div>
                <div class="detail-value">${new Date(inv.dueDate).toLocaleDateString('en-GB')}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Late rate</div>
                <div class="detail-value">${inv.lateRate}% per month</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Interest accrued</div>
                <div class="detail-value">${formatCurrency(lateInterest)}</div>
              </div>
            </div>
            
            <div class="escalation-badge stage-${stage.stage}">${stage.name}</div>
            
            <div class="invoice-actions">
              <button onclick="showTemplate(${inv.id}, '${inv.clientName}', ${inv.amount}, '${inv.invoiceRef}', '${inv.dueDate}', ${inv.lateRate}, ${daysOverdue}, ${lateInterest}, ${totalDue})">📧 Email template</button>
              <button onclick="markPaid(${inv.id})">✓ Mark paid</button>
              <button onclick="deleteInvoice(${inv.id})">🗑 Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // Show template modal
    function showTemplate(id, client, amount, ref, dueDate, rate, daysOverdue, interest, totalDue) {
      const daysLeft = calculateDays(dueDate);
      const stage = getEscalationStage(daysLeft);
      
      let template = stage.template
        .replace(/{CLIENT}/g, client)
        .replace(/{AMOUNT}/g, formatCurrency(amount))
        .replace(/{REF}/g, ref)
        .replace(/{DUEDATE}/g, new Date(dueDate).toLocaleDateString('en-GB'))
        .replace(/{DAYSOVERDUE}/g, daysOverdue)
        .replace(/{LATEINTEREST}/g, formatCurrency(interest))
        .replace(/{TOTALDUE}/g, formatCurrency(totalDue))
        .replace(/{RATE}/g, rate);
      
      document.getElementById('modalTitle').textContent = `${stage.name}`;
      document.getElementById('modalContent').innerHTML = `
        <div>
          <div class="stat-box">
            <div class="stat-label">Escalation stage</div>
            <div class="stat-value">${stage.name}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Tone</div>
            <div class="stat-value">${stage.tone.charAt(0).toUpperCase() + stage.tone.slice(1)}</div>
          </div>
        </div>
        <div>
          <label style="font-weight: 600; display: block; margin-bottom: 8px;">Email template:</label>
          <div class="template-text">${template}</div>
        </div>
      `;
      
      currentModal = template;
      document.getElementById('templateModal').classList.add('active');
    }
    
    // Copy template
    function copyToClipboard() {
      navigator.clipboard.writeText(currentModal).then(() => {
        alert('Template copied to clipboard!');
      });
    }
    
    // Close modal
    function closeModal() {
      document.getElementById('templateModal').classList.remove('active');
    }
    
    // Mark as paid
    function markPaid(id) {
      invoices = invoices.filter(inv => inv.id !== id);
      saveInvoices();
    }
    
    // Delete invoice
    function deleteInvoice(id) {
      if (confirm('Delete this invoice?')) {
        invoices = invoices.filter(inv => inv.id !== id);
        saveInvoices();
      }
    }
    
    // Export invoices
    function exportInvoices() {
      const json = JSON.stringify(invoices, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `maybepayme-invoices-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }
    
    // Import invoices
    function importInvoices() {
      const file = document.getElementById('importFile').files[0];
      if (!file) {
        alert('Please select a file');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          invoices = [...invoices, ...imported];
          saveInvoices();
          alert(`Imported ${imported.length} invoice(s)`);
          document.getElementById('importFile').value = '';
        } catch (err) {
          alert('Invalid JSON file');
        }
      };
      reader.readAsText(file);
    }
    
    // Tab switching
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
    }
    
    document.querySelectorAll('.tab-button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        switchTab(e.target.dataset.tab);
      });
    });
    
    // Load invoices on page load
    window.addEventListener('load', loadInvoices);
    
    // Update countdowns every minute
    setInterval(renderInvoices, 60000);
  </script>
</body>
</html>
