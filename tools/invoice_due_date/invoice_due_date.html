<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Free to use, simple invoice due date calculator. Designed specifically for creative freelancers and small business owners. Calculate invoicing dates quickly and easily.">
    <title>Invoice Due Date Calculator | Maybe Pay Me</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Instrument+Serif:ital@0;1&family=Spline+Sans:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="header-nav">
        <a href="../../index.html" class="back-btn">← Back</a>
    </div>

    <div class="main-wrapper">
        <div class="header-section">
            <h1>Invoice Due Date Calculator 🗓️</h1>
            <p>Enter the invoice date and payment terms to find the due date.</p>
        </div>

        <div class="calculator-card">

            <div class="input-group">
                <label for="invoiceDate">Invoice Date</label>
                <input type="date" id="invoiceDate" required>
            </div>

            <div class="input-group">
                <label for="paymentTerms">Payment Terms (Days)</label>
                <input type="number" id="paymentTerms" value="30" min="0" placeholder="e.g. 30">
            </div>

            <!-- Toggle Switch Section -->
            <div class="toggle-container">
                <span id="toggleLabel">Calculate Using: <strong>Calendar Days</strong></span>
                <label class="switch">
                    <input type="checkbox" id="calculationTypeToggle">
                    <span class="slider round"></span>
                </label>
            </div>

            <!-- Calculate Button -->
            <button id="calculateBtn" class="btn-primary">Calculate Due Date</button>

            <!-- Result Box with Copy Button -->
            <div class="result-box" id="resultBox">
                <span id="resultText" class="placeholder-text">Due date</span>
                <button id="copyBtn" class="copy-btn" title="Copy to Clipboard">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    </svg>
                </button>
            </div>
        </div>

        <div class="disclaimer">
            <strong>🔒 Privacy Note:</strong> We don't save your numbers. </br> All calculations happen locally in your
            browser, so your invoice secrets are safe with you.
            <div class="back-btn-mobile">
                <a href="../../index.html" class="back-btn">← Back</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <!-- 100% privacy-first analytics -->
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
</body>

</html>
